services:

  postgres:
    image: postgres:17
    container_name: todo-postgres
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U todo"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: todo-redis
    ports:
      - "6379:6379"


  backend:
    build:
      context: ./backend

    container_name: todo-backend

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://todo:123456@postgres:5432/todo_db
      REDIS_HOST: redis

    depends_on:
      - postgres
      - redis


  frontend:
    build:
      context: ./frontend

    container_name: todo-frontend

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  postgres_data: